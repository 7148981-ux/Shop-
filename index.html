<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>888.shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--card:#f4f4f6;--text:#1c1c1e;--muted:#6e6e73;--accent:#d9480f;--tab:#e9e9ee;--line:#d8d8de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#232328;--text:#f2f2f5;--muted:#9a9aa3;--accent:#ff8a4c;--tab:#2c2c33;--line:#3a3a42}}
:root[data-theme="dark"]{--bg:#17171a;--card:#232328;--text:#f2f2f5;--muted:#9a9aa3;--accent:#ff8a4c;--tab:#2c2c33;--line:#3a3a42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 8px}
h1{margin:0;font-size:22px}
.tabs{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:0 0 auto;border:0;border-radius:20px;padding:9px 16px;background:var(--tab);color:var(--text);font-size:15px;cursor:pointer}
.tab.active{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 24px}
.card{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pic{font-size:44px;text-align:center;padding:8px 0}
.name{font-weight:600;font-size:15px}
.meta{color:var(--muted);font-size:13px}
.price{color:var(--accent);font-weight:700;font-size:16px;margin-top:auto}
.btn{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty button{width:38px;height:38px;border:0;border-radius:12px;background:var(--tab);color:var(--text);font-size:20px;cursor:pointer}
.qty span{font-weight:700;min-width:24px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:10}
.bar .btn{display:flex;justify-content:space-between;padding:14px 16px;font-size:16px}
.bar.hidden{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-height:85%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ph h2{margin:0;font-size:20px}
.x{border:0;background:var(--tab);color:var(--text);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}
.row .qty{width:130px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:14px 0}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>888.shop</h1></header>
<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>
<div class="bar hidden" id="bar"><button class="btn" data-act="cart"><span id="bcount"></span><span id="bsum"></span></button></div>
<div class="sheet" id="sheet"><div class="panel">
  <div class="ph"><h2>Корзина</h2><button class="x" data-act="close">✕</button></div>
  <div id="list"></div>
  <div id="foot"></div>
</div></div>
<script>
// ВПИШИТЕ username продавца в Telegram без @
var SELLER = "OQOQQOOO";

var DATA = {
  "Бутылки": [
    ["Коллекционная бутылка №1","🍾","пустая, 0.7 л",100],
    ["Коллекционная бутылка №2","🍾","пустая, 0.7 л",100],
    ["Коллекционная бутылка №3","🍾","пустая, 1 л",100],
    ["Коллекционная бутылка №4","🍾","пустая, 0.5 л",100]
  ],
  "Одежда": [
    ["Футболки","👕","S-XXL",100],
    ["Штаны","👖","S-XXL",100],
    ["Майки","🎽","S-XXL",100]
  ],
  "Информация": "<div class='name' style='font-size:18px;margin-bottom:8px'>О магазине 888.shop</div><p style='margin:0 0 10px;line-height:1.5'>Магазин был придуман и основан в 2026 году.</p><p style='margin:0 0 10px;line-height:1.5'>У нас вы найдёте интересные товары и коллекционные предметы, которые не встретишь в обычных магазинах.</p><p style='margin:0;line-height:1.5'>🎁 Мы часто проводим розыгрыши от магазина и готовим другие приятные сюрпризы для покупателей. Следите за обновлениями!</p>"
};

var tg = window.Telegram && window.Telegram.WebApp;
try{ if(tg){tg.ready();tg.expand();} }catch(e){}

var cart = {}, cur = null;
var tabsEl=document.getElementById("tabs"), gridEl=document.getElementById("grid");
var keys=Object.keys(DATA);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function find(id){var p=id.split("|");return DATA[p[0]][+p[1]];}
function qtyOf(id){return cart[id]||0;}
function setQty(id,q){ if(q<=0) delete cart[id]; else cart[id]=q; refresh(); }
function totals(){var n=0,s=0;for(var id in cart){n+=cart[id];s+=cart[id]*find(id)[3];}return {n:n,s:s};}

function ctrl(id){
  var q=qtyOf(id);
  if(!q) return '<button class="btn" data-act="add" data-id="'+esc(id)+'">В корзину</button>';
  return '<div class="qty"><button data-act="dec" data-id="'+esc(id)+'">−</button><span>'+q+'</span><button data-act="inc" data-id="'+esc(id)+'">+</button></div>';
}

function show(k){
  cur=k;
  Array.prototype.forEach.call(tabsEl.children,function(b){b.classList.toggle("active",b.textContent===k)});
  if(typeof DATA[k]==="string"){gridEl.innerHTML='<div class="card" style="grid-column:1/-1">'+DATA[k]+'</div>';return;}
  gridEl.innerHTML=DATA[k].map(function(p,i){
    var id=k+"|"+i;
    return '<div class="card"><div class="pic">'+p[1]+'</div><div class="name">'+esc(p[0])+'</div><div class="meta">'+esc(p[2])+'</div><div class="price">'+p[3]+' ₽</div>'+ctrl(id)+'</div>';
  }).join("");
}

function renderBar(){
  var t=totals(), bar=document.getElementById("bar");
  bar.classList.toggle("hidden",t.n===0);
  document.getElementById("bcount").textContent="Корзина · "+t.n+" шт";
  document.getElementById("bsum").textContent=t.s+" ₽";
}

function renderCart(){
  var list=document.getElementById("list"), foot=document.getElementById("foot"), t=totals();
  if(!t.n){list.innerHTML='<div class="empty">Корзина пуста</div>';foot.innerHTML="";return;}
  list.innerHTML=Object.keys(cart).map(function(id){
    var p=find(id);
    return '<div class="row"><div class="t"><div class="name">'+esc(p[0])+'</div><div class="meta">'+p[3]+' ₽</div></div><div class="qty"><button data-act="dec" data-id="'+esc(id)+'">−</button><span>'+cart[id]+'</span><button data-act="inc" data-id="'+esc(id)+'">+</button></div></div>';
  }).join("");
  foot.innerHTML='<div class="total"><span>Итого</span><span>'+t.s+' ₽</span></div><button class="btn" data-act="pay">Оплатить</button><div class="note">Заказ уйдёт продавцу в Telegram, оплату и доставку вы согласуете с ним</div>';
}

function refresh(){ if(cur) show(cur); renderBar(); renderCart(); }

function checkout(){
  var t=totals(); if(!t.n) return;
  var lines=Object.keys(cart).map(function(id){var p=find(id);return "• "+p[0]+" × "+cart[id]+" — "+(cart[id]*p[3])+" ₽";});
  var text="Здравствуйте! Хочу заказать:\n"+lines.join("\n")+"\nИтого: "+t.s+" ₽";
  var url="https://t.me/"+SELLER+"?text="+encodeURIComponent(text);
  if(tg && tg.openTelegramLink){ tg.openTelegramLink(url); } else { window.location.href=url; }
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var a=t.dataset.act, id=t.dataset.id;
  if(a==="tab") show(id);
  else if(a==="add"||a==="inc") setQty(id,qtyOf(id)+1);
  else if(a==="dec") setQty(id,qtyOf(id)-1);
  else if(a==="cart"){renderCart();document.getElementById("sheet").classList.add("open");}
  else if(a==="close") document.getElementById("sheet").classList.remove("open");
  else if(a==="pay") checkout();
});
document.getElementById("sheet").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });

keys.forEach(function(k){
  var b=document.createElement("button");
  b.className="tab"; b.textContent=k; b.dataset.act="tab"; b.dataset.id=k;
  tabsEl.appendChild(b);
});
show(keys[0]); renderBar();
</script>
</body>
</html>
